[build]
  command = "npm run build:client"
  functions = "netlify/functions"
  publish = "dist/spa"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

# API requests route to Netlify serverless function
[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"

# SPA catch-all redirect for React Router routes
[[redirects]]
  from = "/*"
  status = 200
  to = "/index.html"
